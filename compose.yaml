name: face-recognition-access-lab

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: face_access
      POSTGRES_USER: face_access
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U face_access -d face_access"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - face_access_postgres_data:/var/lib/postgresql/data

volumes:
  face_access_postgres_data:
