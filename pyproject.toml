[project]
name = "face-recognition-access-lab"
version = "0.1.0"
description = "Laboratorio modular de reconhecimento facial para controle de acesso consentido."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "numpy>=2.1",
  "opencv-python-headless>=4.10,<5",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36",
  "structlog>=24.4",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
face-access-api = "face_access.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/face_access"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=face_access --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["face_access"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["face_access"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2", "pgvector.*"]
ignore_missing_imports = true
